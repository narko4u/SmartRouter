<svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
        </marker>
        <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
        </marker>
        <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
        </marker>
        <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
        </marker>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Background Grid -->
      <rect width="1040" height="720" fill="url(#grid)"/>

      <!-- ===== ARROWS (drawn first so they render behind boxes) ===== -->

      <!-- User → API Gateway -->
      <path d="M 100 140 L 100 195" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#arrow-cyan)"/>

      <!-- API Gateway → QSE -->
      <path d="M 250 260 L 250 310" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrow-emerald)"/>
      <text x="260" y="290" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">Score lookup</text>

      <!-- API Gateway → RDE -->
      <path d="M 400 260 L 400 310" stroke="#34d399" stroke-width="1.5" fill="none" marker-end="url(#arrow-emerald)"/>

      <!-- RDE → Fallback Controller -->
      <path d="M 400 420 L 400 475" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-rose)"/>

      <!-- Fallback → Provider 1 -->
      <path d="M 300 540 L 170 540 L 170 585" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

      <!-- Fallback → Provider 2 -->
      <path d="M 400 540 L 400 585" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

      <!-- Fallback → Provider 3 -->
      <path d="M 500 540 L 630 540 L 630 585" stroke="#fb923c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

      <!-- RDE → CostGov -->
      <path d="M 520 340 L 630 340 L 630 390" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-violet)"/>

      <!-- CostGov → RDE feedback -->
      <path d="M 750 420 L 520 420" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-violet)"/>

      <!-- Registry → RDE -->
      <path d="M 750 260 L 750 310" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arrow-violet)"/>

      <!-- Provider responses back through Fallback -->
      <path d="M 170 635 C 120 635 100 500 250 500" stroke="#fb923c" stroke-width="1" stroke-dasharray="2,3" fill="none" marker-end="url(#arrow-orange)"/>
      <text x="90" y="570" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">Response with quality</text>
      <text x="90" y="580" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">feedback loop</text>

      <!-- ===== USER LAYER ===== -->
      <text x="40" y="70" fill="#64748b" font-size="9" font-weight="600" font-family="JetBrains Mono, monospace">USER LAYER</text>

      <!-- User box -->
      <rect x="40" y="80" width="120" height="60" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="41" y="81" width="118" height="58" rx="5" fill="rgba(8, 51, 68, 0.4)"/>
      <text x="100" y="107" fill="#22d3ee" font-size="12" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">User / App</text>
      <text x="100" y="123" fill="#64748b" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Inference Request</text>

      <!-- ===== ROUTING LAYER ===== -->
      <text x="40" y="240" fill="#64748b" font-size="9" font-weight="600" font-family="JetBrains Mono, monospace">ROUTING LAYER</text>

      <rect x="40" y="200" width="960" height="140" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="8,4"/>

      <!-- API Gateway -->
      <rect x="40" y="210" width="120" height="50" rx="6" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="100" y="233" fill="#22d3ee" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">API Gateway</text>
      <text x="100" y="248" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Load Balancer</text>

      <!-- Quality Scoring Engine -->
      <rect x="190" y="210" width="120" height="50" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
      <text x="250" y="230" fill="#34d399" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">QSE</text>
      <text x="250" y="245" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Quality Scoring Engine</text>
      <text x="250" y="255" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">200+ benchmarks</text>

      <!-- Routing Decision Engine -->
      <rect x="340" y="210" width="120" height="50" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
      <text x="400" y="230" fill="#34d399" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">RDE</text>
      <text x="400" y="245" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Routing Decision Engine</text>
      <text x="400" y="255" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Weighted composite scoring</text>

      <!-- Provider Registry -->
      <rect x="690" y="210" width="120" height="50" rx="6" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="750" y="230" fill="#a78bfa" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">Registry</text>
      <text x="750" y="245" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Provider Registry</text>
      <text x="750" y="255" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Hot-reloadable</text>

      <!-- ===== DECISION LAYER ===== -->
      <text x="40" y="400" fill="#64748b" font-size="9" font-weight="600" font-family="JetBrains Mono, monospace">DECISION &amp; GOVERNANCE LAYER</text>

      <rect x="40" y="340" width="960" height="100" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="8,4"/>

      <!-- Fallback Controller -->
      <rect x="340" y="360" width="120" height="50" rx="6" fill="rgba(136, 19, 55, 0.5)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="400" y="383" fill="#fb7185" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">Fallback Ctrl</text>
      <text x="400" y="398" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">3-state circuit breaker</text>

      <!-- Cost Governance -->
      <rect x="630" y="360" width="120" height="50" rx="6" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="690" y="380" fill="#a78bfa" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">Cost Gov</text>
      <text x="690" y="395" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Budget State Machine</text>

      <!-- ===== PROVIDER LAYER ===== -->
      <text x="40" y="570" fill="#64748b" font-size="9" font-weight="600" font-family="JetBrains Mono, monospace">PROVIDER LAYER</text>

      <!-- Provider 1 -->
      <rect x="110" y="585" width="120" height="60" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="170" y="610" fill="#fb923c" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">DeepSeek</text>
      <text x="170" y="625" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Direct API</text>

      <!-- Provider 2 -->
      <rect x="340" y="585" width="120" height="60" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="400" y="610" fill="#fb923c" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">OpenRouter</text>
      <text x="400" y="625" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Multi-provider</text>

      <!-- Provider 3 -->
      <rect x="570" y="585" width="120" height="60" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="630" y="610" fill="#fb923c" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">Anthropic</text>
      <text x="630" y="625" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Claude API</text>

      <!-- Provider 4 -->
      <rect x="800" y="585" width="120" height="60" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="#fb923c" stroke-width="1.5"/>
      <text x="860" y="610" fill="#fb923c" font-size="10" text-anchor="middle" font-weight="600" font-family="JetBrains Mono, monospace">OpenAI</text>
      <text x="860" y="625" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">GPT API</text>

      <!-- Legend -->
      <rect x="40" y="660" width="960" height="45" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="45" y="665" width="22" height="6" rx="2" fill="#22d3ee"/><text x="73" y="672" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Request Flow</text>
      <rect x="175" y="665" width="22" height="6" rx="2" fill="#fb7185"/><text x="203" y="672" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Fallback Flow</text>
      <rect x="310" y="665" width="22" height="6" rx="2" fill="#a78bfa"/><text x="338" y="672" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Governance</text>
      <rect x="435" y="665" width="22" height="6" rx="2" fill="#fb923c"/><text x="463" y="672" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Provider Opt</text>
      <text x="690" y="672" fill="#475569" font-size="8" font-family="JetBrains Mono, monospace">Patent: AU 2026905005</text>
      <text x="850" y="672" fill="#475569" font-size="8" font-family="JetBrains Mono, monospace">v1.0 | Empire Labs</text>
    </svg>